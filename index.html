<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Elenco | Atores e Atrizes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambiente" aria-hidden="true"></div>

  <header class="topo">
    <div class="container">
      <span class="selo">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2l2.9 6.9L22 9.3l-5.4 4.8L18.2 21 12 17.3 5.8 21l1.6-6.9L2 9.3l7.1-.4z"/></svg>
        Catálogo de talentos
      </span>
      <h1 class="titulo">Elenco <em>em destaque</em></h1>
      <p class="subtitulo">Conheça os atores e atrizes que marcaram as séries mais aclamadas da televisão.</p>

      <div class="busca">
        <svg class="busca-icone" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="campoBusca"
          class="busca-campo"
          placeholder="Buscar por nome…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Buscar atores e atrizes pelo nome"
          oninput="filtrarAtores()"
        >
        <kbd class="busca-atalho" aria-hidden="true">/</kbd>
      </div>

      <p class="contador" id="contador" aria-live="polite"></p>
    </div>
  </header>

  <main class="container">
    <section class="grade" id="grade" aria-label="Lista de atores e atrizes"></section>

    <div class="vazio" id="vazio" hidden>
      <svg viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M20 20l-3.5-3.5M8.5 11h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2>Nenhum resultado encontrado</h2>
      <p>Não há atores ou atrizes com o nome <strong id="termoVazio"></strong>.</p>
      <button type="button" class="botao" onclick="limparBusca()">Limpar busca</button>
    </div>
  </main>

  <footer class="rodape">
    <div class="container">Checkpoint 2 | FIAP | Por <a href="linkedin.com/in/opedroricardo/">Pedro Ricardo de Almeida</a> (RM567056)</div>
  </footer>

  <script src="dados.js"></script>
  <script src="script.js"></script>
</body>
</html>
